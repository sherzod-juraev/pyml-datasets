[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# --- Project --- #
[project]
name = "pyml-datasets"
dynamic = ["version"]
description = "Classic tabular datasets in NPZ format for pyml — a machine learning library built from scratch"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0 AND CC0-1.0"
license-files = ["LICENSE", "LICENSES/*", "NOTICE.md"]
authors = [
    {name = "Sherzod Juraev", email = "juraevsherzod9943@gmail.com"}
]
keywords = [
    "datasets",
    "machine-learning",
    "education",
    "numpy",
    "npz",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.0",
]

# --- Dependency groups --- #
[dependency-groups]
# --- Development tools --- #
dev-test = [
    "pytest>=8.0",
    "pytest-sugar>=1.0",
    "pytest-cov>=7.1.0",
]
dev-lint = ["ruff>=0.6.0"]
dev-types = ["mypy>=1.11"]
dev-docstring = ["interrogate>=1.7.0"]
dev-package = ["build>=1.2"]
dev = [
    {include-group = "dev-test"},
    {include-group = "dev-lint"},
    {include-group = "dev-types"},
    {include-group = "dev-docstring"},
    {include-group = "dev-package"},
    "scikit-learn>=1.4.0",
    "ucimlrepo>=0.0.7",
]
# --- Documentation tools --- #
docs-lint = [
    "doc8>=1.0.0",
    "rstcheck>=6.0.0",
    "sphinx-lint>=1.0.0",
]
docs-build = [
    "pydata-sphinx-theme>=0.15.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=2.2.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
    "sphinx-notfound-page>=1.1.0",
    "sphinxext-opengraph>=0.13.0",
    "sphinx-sitemap>=2.6.0",
]
docs = [
    {include-group = "docs-lint"},
    {include-group = "docs-build"},
]
docs-live = [
    {include-group = "docs-build"},
    "sphinx-autobuild>=2025.8.25",
]
nox = ["nox>=2026.2.9"]

# --- Urls --- #
[project.urls]
Homepage = "https://github.com/sherzod-juraev/pyml-datasets"
Repository = "https://github.com/sherzod-juraev/pyml-datasets"
Issues = "https://github.com/sherzod-juraev/pyml-datasets/issues"
pyml = "https://github.com/sherzod-juraev/pyml"

# --- Setuptools --- #
[tool.setuptools.dynamic]
version = {attr = "pyml_datasets.__version__"}

[tool.setuptools.packages.find]
where = [".",]
include = ["pyml_datasets", "pyml_datasets.*",]
exclude = [
    "tests", "tests.*",
]

[tool.setuptools.package-data]
pyml_datasets = ["py.typed", "data/*.npz", "data/MANIFEST.json"]

# --- Pytest --- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
filterwarnings = ["error"]

# --- Ruff --- #
[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "pyml_datasets/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
    "noxfile.py",
]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
select = [
    "B", "C4", "D", "E", "F", "I", "N", "UP", "SIM", "W",
]
ignore = [
    "N803", "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D", "N802", "SIM",
]

# --- Mypy --- #
[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "ucimlrepo.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --- Interrogate --- #
[tool.interrogate]
fail-under = 100
verbose = 1
quiet = false
whitelist-regex = []
color = true
exclude = [
    "docs",
    "tests",
]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false


# --- Docs quality tools --- #
[tool.rstcheck]
ignore_directives = [
    "autoclass", "autofunction",
    "button-link", "button-ref",
    "card",
    "doctest", "dropdown",
    "grid", "grid-item-card",
    "only",
    "plot",
    "tab-item", "tab-set",
    "toctree",
]
ignore_substitutions = [
    "home_description",
]
ignore_messages = [
    "Unknown target name",
]
ignore_rules = [
    "class",
    "doc",
    "func",
    "meth",
    "ref",
]
report_level = "warning"
ignore_paths = [
    "docs/build/*",
]

[tool.doc8]
max-line-length = 100
ignore = ["D000",]
ignore_paths = [
    "docs/build",
    "docs/source/_static",
]

[tool.sphinx-lint]
max-line-length = 100
exclude = [
    "docs/build",
]

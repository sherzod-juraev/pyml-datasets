version: 2

updates:
  # Python dependencies: pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # Dependabot writes the commit messages and the pull request titles as "chore: ...",
      # which is a Conventional Commit.
      prefix: "chore"

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
